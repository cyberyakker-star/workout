<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)">
<title>Workout</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workout">
<style>
:root{
  --bg:#F7F8FA; --card:#FFFFFF; --ink:#15181D; --ink2:#2C3440; --muted:#5B6370; --line:#E3E7ED; --soft:#EEF1F5;
  --accent:#1F6F54; --accent-ink:#FFFFFF; --accent-press:#17573F; --tint:#DDEFE6; --tint-ink:#17573F;
  --warn:#9A4A1B; --warn-tint:#FCE5D6; --ring:#E6E9EE; --scrim:rgba(15,17,20,.38);
  --shadow:0 6px 18px rgba(21,24,29,.07); --shadow-lg:0 10px 30px rgba(21,24,29,.12);
  --round:ui-rounded,"SF Pro Rounded","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1114; --card:#1A1D22; --ink:#F2F4F7; --ink2:#D5DAE1; --muted:#A1AAB6; --line:#2A2F37; --soft:#23272E;
    --accent:#237A5B; --accent-ink:#FFFFFF; --accent-press:#1B6249; --tint:#17352B; --tint-ink:#9ADBBF;
    --warn:#F2A774; --warn-tint:#3A2618; --ring:#2A2F37; --scrim:rgba(0,0,0,.55);
    --shadow:0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none;min-height:100dvh}
button{font:inherit;color:inherit}
svg:not([width]){width:22px;height:22px;flex-shrink:0}
.li > svg:not(.fig){color:var(--muted)}
.chev svg{width:18px;height:18px;display:block}
button,a,.press{touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px}
.hold{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
h1,h2,h3{font-family:var(--round);margin:0}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 104px)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
@media (prefers-color-scheme: dark){ .eyebrow{color:var(--tint-ink)} }
.cap{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border:0;border-radius:999px;background:var(--accent);
  color:var(--accent-ink);font-family:var(--round);font-weight:800;font-size:20px;cursor:pointer;width:100%;text-decoration:none}
.btn:active{background:var(--accent-press);transform:scale(.99)}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.sm{height:46px;font-size:17px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:16px;padding:10px 12px;min-height:44px;cursor:pointer}
@media (prefers-color-scheme: dark){ .link{color:var(--tint-ink)} }
.icon-btn{width:44px;height:44px;border-radius:999px;border:0;background:var(--soft);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.round-btn{width:60px;height:60px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0}
.round-btn svg{width:24px;height:24px}
.round-btn.big{width:84px;height:84px;background:var(--accent);color:var(--accent-ink)}
.round-btn.big svg{width:32px;height:32px}
.round-btn:active{transform:scale(.96)}

/* cards */
.card{background:var(--card);border-radius:26px;box-shadow:var(--shadow)}
.press{transition:transform .12s ease}
.pressing{transform:scale(.97)}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello small{display:block;font-size:16px;color:var(--muted)}
.hello b{display:block;font-family:var(--round);font-weight:900;font-size:34px;line-height:1.1}
.av{width:48px;height:48px;border-radius:999px;border:0;color:#fff;font-family:var(--round);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.week{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;margin-top:18px}
.week b{font-size:17px}
.dots{display:flex;gap:8px}
.dots i{width:28px;height:28px;border-radius:999px;border:3px solid #B8C0CC;display:flex;align-items:center;justify-content:center}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots i.on::after{content:"";width:9px;height:5px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.nudge{margin:14px 4px 0;font-size:15px;line-height:1.45;color:var(--ink2)}
.nudge.warn{color:var(--warn)}

/* next-up */
.hero{padding:20px;margin-top:16px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-lg);border-radius:30px}
.hero-top{display:flex;align-items:center;gap:16px}
.hero-top .t{font-family:var(--round);font-weight:900;font-size:28px;line-height:1.1}
.hero-top .s{font-size:16px;font-weight:600;color:var(--ink2);margin-top:2px}
.hero-top .m{margin-top:6px}
.hero .row2{display:flex;justify-content:center}
.done-badge{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--tint-ink);font-weight:700;font-size:13px;border-radius:999px;padding:5px 10px}

/* routine tiles */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 12px}
.sec h2{font-weight:900;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border:0;text-align:left;cursor:pointer;position:relative;color:var(--ink)}
.tile .n{font-size:17px;font-weight:700;line-height:1.2}
.tile .badge{position:absolute;top:12px;right:12px;background:var(--tint);color:var(--tint-ink);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 8px}
.tile.add{align-items:center;justify-content:center;text-align:center;min-height:150px;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line);background:transparent}
.tile.add .plus{width:56px;height:56px;border-radius:999px;background:var(--tint);color:var(--tint-ink);display:flex;align-items:center;justify-content:center}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:8px 0 calc(var(--sab) + 6px)}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:84px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;padding:4px 0}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--accent);font-weight:800}
@media (prefers-color-scheme: dark){ .tabbar button.on{color:var(--tint-ink)} }

/* full-screen layers */
.layer{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:up .22s ease}
.layer.white{background:var(--card)}
@keyframes up{from{transform:translateY(18px)}to{transform:none}}
.lwrap{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 14px) 20px calc(var(--sab) + 170px)}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.lhead .mid{text-align:center;flex:1}
.lhead .mid b{display:block;font-size:17px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:14px 20px calc(var(--sab) + 14px);z-index:31}
.foot .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}

/* overview */
.ov-title h1{font-weight:900;font-size:32px;line-height:1.1;margin-top:14px}
.ov-title p{margin:6px 0 0;font-size:17px;font-weight:600;color:var(--ink2)}
.seg{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:999px}
.seg button{flex:1 1 0;height:44px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font-weight:600;font-size:15px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(21,24,29,.14)}
.segs{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.lvl-note{margin:0 6px;font-size:15px;line-height:1.4;color:var(--ink2)}
.lvl-note b{font-weight:700;color:var(--ink)}
.segs+.lvl-note,.ov-title+.lvl-note{margin-top:12px}
.grp{margin-top:22px}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px}
.grp-h span{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grp-b{padding:4px 6px 4px 14px}
.grp.pair .grp-b{box-shadow:var(--shadow),inset 4px 0 0 var(--tint)}
.mv{display:flex;align-items:center;gap:14px;padding:8px 0;border-top:1px solid var(--soft);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:var(--ink)}
.mv:first-child{border-top:0}
.mv .fig{flex-shrink:0}
.mv .tx{flex:1;min-width:0}
.mv .tx b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.mv .tx small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.mv .tx em{font-style:normal;color:var(--accent);font-weight:600}
.mv .more{width:44px;height:44px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.tip{display:flex;gap:10px;align-items:center;background:var(--tint);color:var(--tint-ink);border-radius:18px;padding:12px 14px;font-size:15px;line-height:1.35;margin-top:16px}
.tip button{margin-left:auto;background:none;border:0;color:inherit;font-weight:700;font-size:15px;cursor:pointer;padding:6px}

/* player */
.pl{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 14px) 20px calc(var(--sab) + 20px);max-width:560px;margin:0 auto;gap:12px}
.pl .lhead{width:100%}
.ringwrap{position:relative;width:min(80vw,44dvh,320px);aspect-ratio:1;flex-shrink:0;margin-top:4px}
.ringwrap svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .figbox{position:absolute;inset:9%;display:flex}
.ringwrap .figbox svg{width:100%;height:100%}
.ring circle{fill:none;stroke-width:6}
.ring .trk{stroke:var(--ring)}
.ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .35s linear}
.ring.rest .val{stroke:#6E9CC4}
.pl-name{display:flex;align-items:center;gap:8px;justify-content:center;text-align:center}
.pl-name h1{font-weight:900;font-size:27px;line-height:1.15}
.info{width:40px;height:40px;border-radius:999px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0;color:var(--muted)}
.pl-sub{font-size:15px;color:var(--muted);text-align:center;margin-top:-6px;min-height:20px}
.pl-big{font-family:var(--round);font-weight:900;font-size:72px;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.pl-big small{font-size:20px;font-weight:700;color:var(--ink2);margin-left:6px}
.pl-lab{font-size:16px;font-weight:700;color:var(--accent);text-align:center}
@media (prefers-color-scheme: dark){ .pl-lab{color:var(--tint-ink)} }
.pl-ctrl{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:auto;padding:8px 0 4px;width:100%;position:sticky;bottom:calc(var(--sab) + 8px);z-index:2}
.pl.reps .ringwrap{width:min(64vw,32dvh,270px)}
.pl-ctrl .btn{flex:1;max-width:260px}
@media (max-height:700px){ .ringwrap{width:min(66vw,34dvh)} .pl{gap:8px} .pl-big{font-size:58px} .pl-name h1{font-size:23px} .wt{padding:4px 4px 4px 14px} }
.bigstep{display:flex;align-items:center;justify-content:center;gap:18px}
.bigstep .round-btn{width:56px;height:56px;box-shadow:none;background:var(--soft)}
.txt-btn{height:52px;min-width:84px;padding:0 14px;border-radius:999px;border:0;background:var(--soft);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;flex-shrink:0}
.wbtn{border:0;background:none;color:inherit;cursor:pointer;padding:0;min-width:72px;min-height:44px;text-decoration:underline dotted;text-underline-offset:4px}
.plusdot{width:44px;height:44px;border-radius:999px;background:var(--tint);color:var(--tint-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pl-next{width:100%;display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:20px;padding:8px 14px 8px 8px}
.pl-next b{display:block;font-size:15px;font-weight:600}
.wt{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:20px;padding:8px 8px 8px 16px}
.wt b{font-size:15px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:999px;border:0;background:var(--card);font-size:22px;font-weight:700;cursor:pointer;color:var(--ink)}
.step span{min-width:64px;text-align:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.try{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--tint);color:var(--tint-ink);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:700;font-size:15px;cursor:pointer}
.setdots{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.setdots i{width:11px;height:11px;border-radius:999px;border:2px solid var(--line)}
.setdots i.on{background:var(--accent);border-color:var(--accent)}
.setdots i.cur{border-color:var(--accent)}

/* finish */
.fin{display:flex;flex-direction:column;gap:18px;align-items:stretch;padding-top:30px}
.bigcheck{width:112px;height:112px;border-radius:999px;background:var(--tint);display:flex;align-items:center;justify-content:center;margin:0 auto}
.bigcheck i{width:76px;height:76px;border-radius:999px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.fin h1{font-weight:900;font-size:32px;text-align:center}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{height:54px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:17px;cursor:pointer;color:var(--ink)}
.choice.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:28px 28px 0 0;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:10px 20px calc(var(--sab) + 20px);animation:sheet .24s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:22px;font-weight:900}
.sheet .opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;border:0;border-top:1px solid var(--soft);background:none;font-size:17px;font-weight:600;text-align:left;cursor:pointer;color:var(--ink)}
.sheet .opt > svg:not(.fig){width:22px;height:22px;flex-shrink:0;color:var(--muted)}
.sheet .opt > .fig{flex-shrink:0}
.sheet .opt.danger{color:#B3261E}
@media (prefers-color-scheme: dark){ .sheet .opt.danger{color:#FF8A80} }
.swaps{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.swaps button{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;flex-shrink:0;border:0;background:none;cursor:pointer;font-size:13px;font-weight:600;line-height:1.25;text-align:center;color:var(--ink)}
.swaps button.on svg{outline:3px solid var(--accent);outline-offset:2px;border-radius:999px}
.stepper-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px}
.stepper-row b{font-size:16px}
.cues{margin:8px 0 0;padding-left:20px;font-size:16px;line-height:1.55;color:var(--ink2)}
.vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;margin-top:14px;border:0;padding:0;cursor:pointer;display:block}
.vid img,.vid iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.vid .pb{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:999px;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}

/* lists */
.list{padding:4px 16px}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--soft);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;color:var(--ink);font-size:16px}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.li .chev{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px;margin-left:6px;vertical-align:2px;background:var(--soft);color:var(--ink2)}
.tag.s1{background:var(--tint);color:var(--tint-ink)}
.tag.s2,.tag.s3{background:var(--warn-tint);color:var(--warn)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:14px;font-weight:700;color:var(--ink2)}
.field input{height:52px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px}
.field input:focus{outline:none;border-color:var(--accent)}
.row-btns{display:flex;gap:10px}
.row-btns > *{flex:1 1 0;min-width:0}
.field input{width:100%}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:16px}
.cal span{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.cal i{aspect-ratio:1;border-radius:10px;background:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:var(--muted)}
.cal i.w{background:var(--accent);color:#fff;font-weight:700}
.cal i.r{background:#3F6FA0;color:#fff;font-weight:700}
.cal i.st{box-shadow:inset 0 0 0 2px var(--accent)}
.cal i.today{outline:2px solid var(--ink);outline-offset:1px}
.cal i.blank{background:none}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%);z-index:60;display:flex;gap:14px;align-items:center;background:#15181D;color:#fff;border-radius:999px;padding:12px 18px;font-size:15px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1;pointer-events:auto}
#toast button{background:none;border:0;color:#9ADBBF;font-weight:800;font-size:15px;cursor:pointer;padding:8px 6px;margin:-8px -6px}

/* setup + builder */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.optc{display:flex;align-items:center;gap:14px;padding:8px 16px 8px 8px;border-radius:24px;background:var(--card);border:2px solid var(--card);box-shadow:var(--shadow);cursor:pointer;text-align:left;color:var(--ink);width:100%}
.optc.on{border-color:var(--accent);box-shadow:none}
.optc .tx{flex:1}
.optc b{display:block;font-size:17px}
.optc small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.tick{width:26px;height:26px;border-radius:999px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.on>.tick{background:var(--accent);border-color:var(--accent)}
.on>.tick::after{content:"";width:9px;height:5px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--card);background:var(--card);box-shadow:var(--shadow);font-weight:600;font-size:15px;cursor:pointer;color:var(--ink)}
.chip.on{border-color:var(--accent);background:var(--tint);box-shadow:none}
.prog{display:flex;gap:6px;flex:1}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--accent)}
.pick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;margin-top:16px}
.pick-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font-size:13px;font-weight:600;line-height:1.25;text-align:center;position:relative;color:var(--ink)}
.pick-grid button .num{position:absolute;top:0;right:8px;width:26px;height:26px;border-radius:999px;background:var(--accent);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}
.picked{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;min-height:60px;align-items:center}
@media (min-width:600px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
</style>
